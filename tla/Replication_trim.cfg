SPECIFICATION Spec
CONSTRAINT Constraint

CONSTANTS
    MaxId = 3
    MaxChan = 4
    Replicas = {r1}
    NeededAcks = 2
    TailCheck = TRUE
    EpochStamp = TRUE
    Fsync = TRUE
    AllowCrash = TRUE
    AllowLoss = TRUE
    TrimRebases = TRUE
    AllowTrim = TRUE
    GateReads = TRUE
    HealOnOpen = TRUE
    AllowTruncate = FALSE

INVARIANTS
    NoConflict
    AckedInPrimary
    AckedSomewhere
    ReadsAreDurable
    ReplicaBaseNotAhead
    CursorInRange
